  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Business Name - Get Your Professional Website</title>
  <style>
    :root{--primary:#2563eb;--primary-dark:#1d4ed8;--secondary:#7c3aed;--accent:#f59e0b;--dark:#0f172a;--light:#f8fafc;--gray:#64748b;--success:#10b981}
    *{margin:0;padding:0;border:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.5;color:#334155}
    body{background:#f8fafc;min-height:100vh;display:flex;flex-direction:column;}

    /* Header */
    header{position:fixed;top:0;left:0;right:0;background:white;padding:1rem;z-index:999;box-shadow:0 2px 10px rgba(37,99,235,.1);display:flex;justify-content:space-between;align-items:center;}
    .logo{font-size:1.5rem;font-weight:bold;color:#2563eb;display:flex;flex-direction:column;line-height:1.2;}
    .owner-badge{background:var(--dark);color:white;padding:.4rem 1rem;border-radius:8px;font-size:.9rem;text-align:center;margin-top:.2rem;}

    /* Navigation */
    nav ul{display:flex;gap:1.5rem;list-style:none;}
    nav a{text-decoration:none;color:#334155;font-weight:600;font-size:.95rem;transition:color .3s;}
    nav a:hover{color:var(--primary);}

    /* Hero */
    .hero{background:linear-gradient(135deg,var(--dark),#1e293b);color:white;padding:8rem 1.5rem 4rem;display:flex;flex-direction:column;align-items:center;text-align:center;}
    .hero h1{font-size:2.8rem;margin-bottom:1rem;line-height:1.1;font-weight:700;}
    .hero p{font-size:1.3rem;color:#cbd5e1;margin-bottom:2rem;max-width:600px;}

    /* Buttons */
    .btn{display:inline-block;padding:.8rem 2rem;background:white;border-radius:8px;font-weight:700;text-decoration:none;color:var(--dark);transition:transform .3s,box-shadow
  .3s;margin-top:1.5rem;cursor:pointer;}
    .btn:hover{transform:translateY(-3px);}

    /* Problem Section */
    .problem{background:white;padding:4rem 1.5rem;text-align:center;}
    .problem h2{font-size:2.2rem;margin-bottom:1.5rem;color:#1e293b;}
    .pain-points{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem,max-width:1000px;margin:0 auto;padding-top:3rem;}

    /* Portfolio */
    .portfolio{background:var(--light);padding:4rem 1.5rem;text-align:center;overflow:hidden;}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-top:3rem;max-width:1200px;margin-left:auto;margin-right:auto;padding:0 auto;}

    /* Contact Form */
    .contact-section{background:white;padding:4rem 1.5rem;text-align:center;color:#ffffff;}
